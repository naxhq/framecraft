name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.1"

jobs:
  # Mirrors `make gate` step 2: pytest (services/bake), zero skipped/xfailed.
  reference-service:
    name: reference-service (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/bake/uv.lock"
          version: ${{ env.UV_VERSION }}

      - name: uv sync
        working-directory: services/bake
        run: uv sync

      - name: pytest -q -rs
        working-directory: services/bake
        run: uv run pytest -q -rs 2>&1 | tee pytest.log

      - name: fail on any skipped/xfailed/xpassed test
        working-directory: services/bake
        run: |
          if grep -qE '[0-9]+ (skipped|xfailed|xpassed)' pytest.log; then
            echo "::error::pytest reported skipped/xfailed test(s); make gate does not accept one"
            grep -E '^SKIPPED|^XFAIL|[0-9]+ (skipped|xfailed|xpassed)' pytest.log || true
            exit 1
          fi
          echo "0 skipped, 0 xfailed, 0 xpassed"

  # Mirrors `make gate` step 3 (minus the Playwright half, which is the e2e
  # job) plus step 1's static no-skip guard, which only needs apps/web on
  # disk, so it runs first, before npm ci.
  web:
    name: web (lint, typecheck, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: static no-skip guard (every vitest + playwright source file)
        run: |
          specs=$(find apps/web -type d \( -name node_modules -o -name .next \) -prune -o \
            -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) -print)
          if [ -z "$specs" ]; then
            echo "::error::found no vitest/playwright source files at all, the glob is wrong"
            exit 1
          fi
          echo "$(echo "$specs" | wc -l | tr -d ' ') test files scanned"
          markers=$(echo "$specs" | xargs grep -nE \
            '(^|[^A-Za-z0-9_$])(test|it|describe|suite|bench)\.(skip|only|fixme|todo|skipIf|failing|fail)\b|(^|[^A-Za-z0-9_$])(xit|xtest|xdescribe)[[:space:]]*\(' \
            2>/dev/null || true)
          if [ -n "$markers" ]; then
            echo "::error::a skip/only/todo/fail marker is committed in a test source"
            echo "$markers"
            exit 1
          fi
          echo "no test.skip / .only / .todo / .fixme / .fail / xit marker anywhere"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci
        working-directory: apps/web
        run: npm ci

      - name: eslint
        working-directory: apps/web
        run: npm run lint

      - name: tsc --noEmit
        working-directory: apps/web
        run: npm run typecheck

      - name: vitest
        working-directory: apps/web
        run: npm test 2>&1 | tee vitest.log

      - name: fail on any skipped/todo vitest test
        working-directory: apps/web
        run: |
          if grep -qE '[0-9]+ (skipped|todo)' vitest.log; then
            echo "::error::vitest reported skipped/todo test(s); make gate does not accept one"
            grep -E '[0-9]+ (skipped|todo)' vitest.log || true
            exit 1
          fi
          echo "0 skipped, 0 todo"

      - name: next build
        working-directory: apps/web
        run: npm run build

      # Mirrors `make gate` step 4: the browser engine building the committed
      # Chicago fixture, judged by the reference Python validator (the CLI
      # validator services/bake stays as, per CLAUDE.md). Needs `uv` only for
      # that judging step, not to run the app itself.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/bake/uv.lock"
          version: ${{ env.UV_VERSION }}

      - name: uv sync (reference service, validator only)
        working-directory: services/bake
        run: uv sync

      # Both files: fixtures/print-params-default.json (color_mode=single, the
      # literal default) and fixtures/print-params-parts.json (color_mode=
      # parts). Single mode's own single-object 3MF is written from
      # EngineResult.merged, a real manifold3d union, so it is expected to
      # pass the validator's `bodies` check exactly like parts mode's
      # assembled union does -- see DECISIONS.md [V3-P2-E4] for the history
      # and the numbers if either file is still red.
      - name: browser engine export:cli (Chicago fixture, single mode)
        working-directory: apps/web
        run: |
          npm run export:cli -- --scene ../../fixtures/chicago-scene.json \
            --params ../../fixtures/print-params-default.json \
            --target generic-3mf --out ../../artifacts/chicago-web-single.3mf

      - name: browser engine export:cli (Chicago fixture, parts mode)
        working-directory: apps/web
        run: |
          npm run export:cli -- --scene ../../fixtures/chicago-scene.json \
            --params ../../fixtures/print-params-parts.json \
            --target generic-3mf --out ../../artifacts/chicago-web-parts.3mf

      # A real, non-suppressed failure ("no test may be weakened to make a
      # gate pass") for either row: if this workflow shows one red, see
      # DECISIONS.md [V3-P2-E4] for the measured numbers before assuming it
      # is a regression here -- it may still be a known, documented gap in
      # lib/engine/solid/** (E2). Scoped to THIS job only: the `e2e` job
      # below has no `needs:` on `web` and keeps running (and reporting its
      # own status) independently.
      # Both run regardless of the first's outcome (plain `&&` would stop at
      # the first failure and hide whether the second file is clean too).
      - name: validate the browser engine's files (single + parts mode)
        working-directory: services/bake
        run: |
          rc=0
          uv run python -m app.cli validate ../../artifacts/chicago-web-single.3mf || rc=1
          uv run python -m app.cli validate ../../artifacts/chicago-web-parts.3mf || rc=1
          exit $rc

  # Mirrors `make gate` steps 4-5 (Playwright against the real stack). The
  # reference API and the web app are started by playwright.config.ts's own
  # `webServer` array (uv run uvicorn on :8000, next dev on :3000, each
  # health-waited), which is this config's documented Safe Order 1: run
  # `playwright test` alone on a tree no build has touched since. That
  # sidesteps the `next build` vs `next dev` `.next` race the config's own
  # top comment warns about, without needing a separate `make up`/curl wait
  # loop here (the `web` job above already proves `next build` succeeds, on
  # an unrelated checkout).
  e2e:
    name: e2e (playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/bake/uv.lock"
          version: ${{ env.UV_VERSION }}

      - name: uv sync (reference service)
        working-directory: services/bake
        run: uv sync

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci (web)
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright chromium (+ OS deps)
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke suite
        working-directory: apps/web
        env:
          E2E_BUDGET_FACTOR: "3"
          # Left empty (overpass.is_offline() only treats 1/true/yes/on as
          # set) so this job runs the same way a native `make gate` does. It
          # is not a network dependency: every current spec routes
          # **/api/interpreter to a committed fixture - A2 (the pin in Lake
          # Michigan) through mockEmptyOverpass, the rotation-nudge and
          # advisor-radius touches through the Chicago mock - so no spec
          # reaches Overpass (v3-02 audit finding 13; see
          # docs/handoff/v3-00-ci.md and RUNBOOK.md section 5).
          FRAMECRAFT_OFFLINE: ""
        run: npm run test:e2e

      - name: zero skipped / zero expected-failure (results.json)
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const file = 'artifacts/e2e/results.json';
            if (!fs.existsSync(file)) {
              console.error('no ' + file + ' - the suite did not run to completion');
              process.exit(1);
            }
            const r = JSON.parse(fs.readFileSync(file, 'utf-8'));
            const s = r.stats || {};
            const n = s.skipped || 0;
            const bad = [];
            const walk = (u) => {
              for (const sp of (u.specs || [])) {
                for (const t of (sp.tests || [])) {
                  const e = t.expectedStatus || 'passed';
                  if (e !== 'passed') bad.push(sp.title + ' [expectedStatus=' + e + ']');
                }
              }
              for (const c of (u.suites || [])) walk(c);
            };
            for (const u of (r.suites || [])) walk(u);
            if (n) {
              console.error(n + ' Playwright test(s) SKIPPED - the gate does not accept a skipped acceptance test');
              process.exit(1);
            }
            if (bad.length) {
              console.error(bad.length + ' Playwright test(s) annotated test.fail() - an expected-failure asserts nothing:');
              for (const b of bad) console.error('  ' + b);
              process.exit(1);
            }
            console.log('playwright: ' + (s.expected||0) + ' passed, ' + (s.unexpected||0) + ' failed, ' + (s.flaky||0) + ' flaky, 0 skipped, 0 expected-failure');
          "

      # playwright.config.ts's own `reporter` is [list, json] with no `html`
      # entry, so there is no `playwright-report/` directory to upload here;
      # `artifacts/e2e/` (results.json plus the outputDir with
      # trace:"retain-on-failure" / screenshot:"only-on-failure" per test)
      # and the service logs are the equivalent, more useful evidence.
      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            artifacts/e2e/**
            artifacts/logs/**
          if-no-files-found: warn
          retention-days: 7
