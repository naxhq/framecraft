# Deploys the static export of apps/web to GitHub Pages on every push to
# main. Its own workflow, independent of ci.yml, kept deliberately simple:
# the CI workflow is the quality gate; this one only publishes.
#
# The site is built with NEXT_PUBLIC_BASE_PATH=/framecraft because a project
# Pages site is served under https://<owner>.github.io/framecraft/. The same
# tree built with an empty base path is what the Tauri desktop app embeds.
#
# One-time repo setup: Settings -> Pages -> Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one but does not
# cancel a deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci
        working-directory: apps/web
        run: npm ci

      - name: next build (static export, sub-path base)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_BASE_PATH: /framecraft
        run: npm run build

      # The six preset Overpass responses, gzipped, beside the app.
      #
      # Live Overpass is the single largest cost of a first preview on the
      # deployed site: 8.5 to 32.4 s on the runs that finished, 504s from
      # overpass-api.de on three of eight attempts, and two of five measured
      # flows that never produced a preview at all (v3-00-baseline 1.6, 1.7).
      # A static host has one shared cache, the build, so the build carries the
      # answers to the six questions every visitor asks first: 8.7 MB of gzip,
      # of which a visitor downloads only the preset they click.
      #
      # Deliberately NOT part of `npm run build`: the e2e suite route-mocks
      # Overpass and clicks the Chicago preset, and a bundled asset in the tree
      # under test would answer before the mock. See the script's header.
      - name: bundle the preset Overpass responses
        working-directory: apps/web
        run: node scripts/bundle-preset-assets.mjs --out out

      # Pages runs Jekyll by default, and Jekyll drops underscore-prefixed
      # paths, which would eat the whole /_next tree. .nojekyll disables it.
      - name: Disable Jekyll
        run: touch apps/web/out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
