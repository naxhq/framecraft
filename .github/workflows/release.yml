# Release workflow: on a v* tag, build the Tauri desktop installers for the
# three desktop platforms and attach them, plus a zip of the static web
# build, to a GitHub Release for that tag.
#
# Code signing is OPTIONAL and entirely secrets-driven; with no secrets set,
# every artifact is built unsigned (users see the usual OS warnings):
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#       Tauri updater artifact signing (only relevant if an updater is ever
#       enabled; harmless to leave unset).
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY,
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#       macOS code signing and notarization (tauri-action picks these up
#       from the environment when present).
#   WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD
#       Windows Authenticode signing (requires the matching signCommand /
#       certificateThumbprint config in tauri.conf.json to be filled in;
#       not configured in this repo, documented here for completeness).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Create the release up front with generated notes, so the matrix builds
  # below only ever ATTACH to it (tauri-action finds it by tag) and the notes
  # are not overwritten by whichever matrix job finishes last.
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "FrameCraft ${GITHUB_REF_NAME}" \
              --generate-notes

  # The matrix itself lives in desktop-build.yml so nightly.yml can run the
  # same three builds on the schedule without duplicating it. Passing
  # `tag_name` is what turns a build into an attach.
  desktop:
    needs: create-release
    # desktop-build.yml declares no permissions of its own, so it runs with
    # what this job grants. tauri-action uploads the installers to the release,
    # which needs write; nightly.yml's caller grants only read and gets a pure
    # build. See the header of desktop-build.yml (v3-14 audit B1).
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-build.yml
    with:
      tag_name: ${{ github.ref_name }}
    secrets: inherit

  # The static web app as a plain zip (no source maps are emitted by this
  # build config), for anyone who wants to self-host the exported site.
  web-zip:
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci
        working-directory: apps/web
        run: npm ci

      - name: next build (static export, root base path)
        working-directory: apps/web
        run: npm run build

      # Brotli and gzip siblings for whoever self-hosts this zip.
      #
      # This is the ONLY consumer the script has, and it is why the zip is
      # where it is wired rather than pages.yml: GitHub Pages compresses on
      # the fly, serves gzip and only gzip, and ignores files a repo ships
      # (measured, docs/handoff/v3-00-baseline.md 1.5), and the desktop shell
      # reads its bundle off local disk with no wire to negotiate on. A server
      # that does honour the siblings -- `scripts/serve-static.mjs` and most
      # static hosts -- gets about 18 % of the JS and 23 % of the WASM back
      # against the gzip it would otherwise produce.
      #
      # Ordered after the map delete so no `.map.br` is written for a file
      # that is about to go.
      - name: Zip the static site (source-map free, precompressed)
        run: |
          find apps/web/out -name '*.map' -delete
          (cd apps/web && node scripts/precompress.mjs --dir out)
          (cd apps/web/out && zip -qr "../../../framecraft-web-${GITHUB_REF_NAME}.zip" .)

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "framecraft-web-${GITHUB_REF_NAME}.zip" --clobber
