[project]
name = "framecraft-bake"
version = "0.1.0"
description = "FrameCraft bake service: OSM ingest, solid geometry, printability validation, 3MF/STL export."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.26",
    "scipy>=1.13",
    "networkx>=3.3",
    "fast-simplification>=0.1.7",
    "manifold3d>=2.5",
    "trimesh>=4.4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "lxml>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/contracts.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
